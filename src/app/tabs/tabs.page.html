<ion-tabs>
  <ion-tab-bar slot="bottom">
    
    <!-- Pestaña: Inicio -->
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>{{ 'TABS.HOME' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Pestaña: Catálogo -->
    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="pricetags-outline"></ion-icon>
      <ion-label>{{ 'TABS.CATALOG' | translate }}</ion-label>
    </ion-tab-button>

    <!-- Pestaña: Agregar Producto -->
    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="add-circle-outline"></ion-icon>
      <ion-label>{{ 'TABS.ADD_PRODUCT' | translate }}</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
